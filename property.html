<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property | HomeFinder Lagos (Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--ink:#12201c;--paper:#f4f6f5;--mist:#e1e8e4;--lagoon:#1f5e4f;--danfo:#f5b800;--muted:#5b6b65;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

  header{background:var(--ink);color:var(--white)}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
  .logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
  .logo span{color:var(--danfo)}
  .back{display:inline-block;margin:22px 0 14px;color:var(--lagoon);font-weight:600}
  .back:hover{text-decoration:underline}

  .layout{display:grid;grid-template-columns:1fr 340px;gap:32px;padding-bottom:56px;align-items:start}
  @media(max-width:860px){.layout{grid-template-columns:1fr}}

  .main-photo{position:relative;border-radius:14px;overflow:hidden;height:380px;background:var(--mist)}
  @media(max-width:600px){.main-photo{height:250px}}
  .main-photo svg,.main-photo img{width:100%;height:100%;display:block}
  .main-photo img,.thumb img{object-fit:cover}
  .thumb img{width:100%;height:100%;display:block}
  .caption{position:absolute;left:12px;bottom:12px;background:rgba(18,32,28,.8);color:var(--white);font-size:13px;padding:4px 10px;border-radius:999px}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:10px}
  .thumb{border:2px solid transparent;border-radius:10px;overflow:hidden;height:74px;padding:0;cursor:pointer;background:none}
  .thumb svg{width:100%;height:100%;display:block}
  .thumb[aria-current="true"]{border-color:var(--danfo)}
  .thumb:focus-visible{outline:3px solid var(--danfo);outline-offset:2px}

  h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.03em;line-height:1.1;margin-top:24px}
  .loc{color:var(--muted);margin-top:4px}
  .facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .fact{background:var(--white);border:1px solid var(--mist);border-radius:10px;padding:8px 14px;font-size:15px}
  h2{font-size:20px;letter-spacing:-.02em;margin:28px 0 8px}
  .desc{max-width:62ch;color:#2c3d37}
  .features{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 16px;list-style:none}
  .features li{padding-left:22px;position:relative}
  .features li::before{content:"";position:absolute;left:0;top:8px;width:10px;height:10px;border-radius:50%;background:var(--danfo)}

  .side{position:sticky;top:16px;background:var(--white);border:1px solid var(--mist);border-radius:14px;padding:20px}
  @media(max-width:860px){.side{position:static}}
  .price{font-size:30px;font-weight:800;letter-spacing:-.03em}
  .price small{font-weight:400;color:var(--muted);font-size:15px}
  .status{display:inline-block;background:var(--danfo);font-weight:600;font-size:13px;padding:3px 10px;border-radius:999px;margin-bottom:8px}
  .side label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  .side input,.side textarea{width:100%;padding:10px;border:1px solid var(--mist);border-radius:8px;font:inherit;background:var(--paper)}
  .side input:focus,.side textarea:focus{outline:3px solid var(--danfo);outline-offset:1px}
  .btn{display:block;width:100%;margin-top:14px;padding:12px;border-radius:8px;border:0;font:inherit;font-weight:600;text-align:center;cursor:pointer}
  .btn.primary{background:var(--ink);color:var(--white)}
  .btn.wa{background:#1fa855;color:var(--white)}
  .btn:focus-visible{outline:3px solid var(--danfo);outline-offset:2px}
  .or{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}
  .sent{margin-top:14px;padding:12px;border-radius:8px;background:#e6f4ec;color:#14532d;font-size:15px}
  .err{color:#9b1c1c;font-size:13px;margin-top:4px}

  .worldmap{padding-bottom:56px}
  .worldmap h2{margin-top:0}
  .mapbar{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 10px}
  .chip{padding:9px 14px;border-radius:999px;border:1px solid var(--ink);background:var(--white);font:inherit;font-weight:600;cursor:pointer}
  .chip:hover{background:var(--ink);color:var(--white)}
  .chip:focus-visible{outline:3px solid var(--danfo);outline-offset:2px}
  #map{height:min(70vh,560px);min-height:340px;border-radius:14px;border:1px solid var(--mist);z-index:0;background:#cfe0e8}
  .map-note{font-size:13px;color:var(--muted);margin-top:6px}
  .missing{text-align:center;padding:80px 0}
  .missing p{color:var(--muted);margin:8px 0 18px}
  .chat-fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:1000;padding:13px 18px;border:0;border-radius:999px;background:var(--danfo);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(18,32,28,.25)}
  .chat-fab:focus-visible,.chat-x:focus-visible,.chat-send:focus-visible,.chip2:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .chat{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:1001;width:360px;max-width:calc(100vw - 24px);height:min(540px,78vh);background:var(--white);border:1px solid var(--mist);border-radius:16px;box-shadow:0 18px 48px rgba(18,32,28,.3);display:flex;flex-direction:column;overflow:hidden}
  .chat[hidden]{display:none}
  .chat-head{background:var(--ink);color:var(--white);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .chat-head strong{display:block;font-size:15px}
  .chat-head span{font-size:12px;color:#9fb0a9}
  .chat-x{border:0;background:transparent;color:var(--white);font-size:24px;line-height:1;cursor:pointer;padding:2px 8px;border-radius:8px}
  .chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
  .bub{max-width:86%;padding:9px 12px;border-radius:14px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
  .bub.bot{background:var(--white);border:1px solid var(--mist);align-self:flex-start;border-bottom-left-radius:4px}
  .bub.me{background:var(--ink);color:var(--white);align-self:flex-end;border-bottom-right-radius:4px}
  .bub.note{align-self:center;background:transparent;border:0;color:var(--muted);font-size:13px;text-align:center}
  .chips2{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;background:var(--paper)}
  .chip2{border:1px solid var(--ink);background:var(--white);border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--mist);background:var(--white)}
  .chat-form input{flex:1;padding:10px;border:1px solid var(--mist);border-radius:10px;font:inherit;background:var(--paper)}
  .chat-form input:focus{outline:3px solid var(--danfo);outline-offset:1px}
  .chat-send{border:0;border-radius:10px;background:var(--ink);color:var(--white);font:inherit;font-weight:600;padding:0 16px;cursor:pointer}
  .chat-send:disabled{opacity:.5;cursor:wait}
  .chat-foot{font-size:11px;color:var(--muted);text-align:center;padding:0 10px 8px;background:var(--white)}
  footer{background:var(--ink);color:#9fb0a9;padding:24px 0;font-size:14px}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="index.html">Home<span>Finder</span> Lagos</a>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap">Demo project for portfolio purposes. All listings, names and prices are fictional.</div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  import { db } from "./firebase.js";
  import { doc, getDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const AGENT = { name: "Demo Agent", whatsapp: "2348000000000" }; // fake number

  const BOT_URL = "https://homefinder-bot.phetboy.workers.dev";

  const $ = id => document.getElementById(id);
  const naira = n => "₦" + n.toLocaleString("en-NG");

  const id = Number(new URLSearchParams(location.search).get("id"));
  let p = null;
  try {
    const snap = await getDoc(doc(db, "listings", String(id)));
    p = snap.exists() ? snap.data() : null;
  } catch (err) {
    console.error(err);
  }
  const app = $("app");

  if (!p) {
    app.innerHTML = `<div class="missing"><h1>We couldn't find that property</h1>
      <p>It may have been sold or removed.</p><a class="btn primary" style="display:inline-block;width:auto;padding:12px 22px" href="index.html">See all listings</a></div>`;
    document.title = "Property not found | HomeFinder Lagos (Demo)";
  } else {
    document.title = p.title + " | HomeFinder Lagos (Demo)";

    // Placeholder room images until real photos are uploaded
    const rooms = ["Front view", "Living room", "Bedroom", "Kitchen"];
    const shade = [0, -22, 14, -10];
    function shadeColor(hex, amt){
      const n = parseInt(hex.slice(1), 16);
      const f = v => Math.max(0, Math.min(255, v + amt));
      return "#" + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, "0")).join("");
    }
    const cl = (u, w) => u.replace("/upload/", `/upload/f_auto,q_auto,w_${w}/`);
    const photos = Array.isArray(p.photos) ? p.photos : [];
    const alt = String(p.title).replace(/"/g, "&quot;");
    const roomSVG = i => {
      const c = shadeColor(p.color, shade[i]);
      return `<svg viewBox="0 0 320 190" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="320" height="190" fill="${c}"/>
        <rect y="140" width="320" height="50" fill="rgba(0,0,0,.18)"/>
        ${i === 0
          ? `<polygon points="100,95 160,50 220,95" fill="rgba(255,255,255,.85)"/><rect x="112" y="95" width="96" height="55" fill="rgba(255,255,255,.7)"/><rect x="148" y="112" width="24" height="38" fill="${c}"/>`
          : `<rect x="70" y="70" width="180" height="70" rx="6" fill="rgba(255,255,255,.7)"/><rect x="90" y="88" width="50" height="52" fill="rgba(255,255,255,.55)"/><rect x="190" y="88" width="40" height="30" fill="rgba(255,255,255,.55)"/>`}
      </svg>`;
    };

    const slides = photos.length
      ? photos.map((u, i) => ({ label: `Photo ${i + 1} of ${photos.length}`,
          big: `<img src="${cl(u, 1000)}" alt="${alt}">`, small: `<img src="${cl(u, 200)}" alt="" loading="lazy">` }))
      : rooms.map((r, i) => ({ label: r, big: roomSVG(i), small: roomSVG(i) }));

    const waText = encodeURIComponent(`Hello, I'm interested in "${p.title}" in ${p.area} (${naira(p.price)}${p.per}).`);

    app.innerHTML = `
      <a class="back" href="index.html">Back to listings</a>
      <div class="layout">
        <div>
          <div class="main-photo" id="main">${slides[0].big}<span class="caption" id="cap">${slides[0].label}</span></div>
          <div class="thumbs" id="thumbs">
            ${slides.map((sl, i) => `<button class="thumb" data-i="${i}" aria-label="Show ${sl.label}" aria-current="${i === 0}">${sl.small}</button>`).join("")}
          </div>

          <h1>${p.title}</h1>
          <div class="loc">${p.area}, Lagos</div>
          <div class="facts">
            <span class="fact">${p.beds} bedroom${p.beds > 1 ? "s" : ""}</span>
            <span class="fact">${p.baths} bathroom${p.baths > 1 ? "s" : ""}</span>
            <span class="fact">${p.sqm} m²</span>
          </div>

          <h2>About this property</h2>
          <p class="desc">${p.desc}</p>

          <h2>Features</h2>
          <ul class="features">${p.features.map(f => `<li>${f}</li>`).join("")}</ul>
        </div>

        <aside class="side">
          <span class="status">${p.type === "rent" ? "For rent" : "For sale"}</span>
          <div class="price">${naira(p.price)}<small>${p.per}</small></div>

          <form id="inq" novalidate>
            <label for="n">Your name</label><input id="n" autocomplete="name">
            <label for="ph">Phone number</label><input id="ph" type="tel" autocomplete="tel">
            <label for="m">Message</label>
            <textarea id="m" rows="3">I'd like to view this property. Is it still available?</textarea>
            <div class="err" id="err" role="alert"></div>
            <button class="btn primary" type="submit">Send inquiry</button>
          </form>
          <div class="sent" id="sent" hidden></div>

          <div class="or">or</div>
          <a class="btn wa" href="https://wa.me/${AGENT.whatsapp}?text=${waText}" target="_blank" rel="noopener">Chat on WhatsApp</a>
        </aside>
      </div>

      <section class="worldmap">
        <h2>Location</h2>
        <div class="mapbar">
          <button type="button" class="chip" id="toProp">Zoom to this property</button>
          <button type="button" class="chip" id="toWorld">Show the whole world</button>
        </div>
        <div id="map" role="img" aria-label="World map with ${p.title} marked in ${p.area}, Lagos"></div>
        <p class="map-note">Approximate location in ${p.area}. The exact address is shared when you inquire. Use the + and - buttons or drag to explore.</p>
      </section>`;

    // Gallery: swap the main image when a thumbnail is clicked
    $("thumbs").addEventListener("click", e => {
      const b = e.target.closest(".thumb"); if (!b) return;
      const i = +b.dataset.i;
      $("main").innerHTML = slides[i].big + `<span class="caption" id="cap">${slides[i].label}</span>`;
      document.querySelectorAll(".thumb").forEach(t => t.setAttribute("aria-current", t === b));
    });

    // Map: uses exact lat/lng if the listing has it, otherwise a spot in its area
    const AREA_COORDS = {
      Yaba: [6.5095, 3.3711], Lekki: [6.4474, 3.4723],
      Surulere: [6.5010, 3.3569], Ikeja: [6.6018, 3.3515]
    };
    const base = AREA_COORDS[p.area] || [6.5244, 3.3792]; // Lagos centre
    const pos = (p.lat && p.lng)
      ? [p.lat, p.lng]
      : [base[0] + ((p.id * 37) % 10 - 5) * 0.002, base[1] + ((p.id * 53) % 10 - 5) * 0.002];

    const map = L.map("map", { scrollWheelZoom: false, minZoom: 1, worldCopyJump: true });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
    const marker = L.marker(pos).addTo(map).bindPopup(p.title);

    // Start on the whole world (zoomed out more on narrow phone screens)
    const worldZoom = map.getSize().x < 700 ? 1 : 2;
    map.setView([20, 0], worldZoom);

    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    function toProperty(){
      map.once("moveend", () => marker.openPopup());
      reduceMotion ? map.setView(pos, 15) : map.flyTo(pos, 15, { duration: 3.5 });
    }
    function toWorld(){
      reduceMotion ? map.setView([20, 0], worldZoom) : map.flyTo([20, 0], worldZoom, { duration: 2.5 });
    }
    $("toProp").addEventListener("click", toProperty);
    $("toWorld").addEventListener("click", toWorld);

    // Show the world for a moment, then fly down to the house
    setTimeout(toProperty, 900);

    // Inquiry form: validates, then shows a confirmation. Step 5 will save it to Firestore.
    $("inq").addEventListener("submit", async e => {
      e.preventDefault();
      const name = $("n").value.trim(), phone = $("ph").value.trim();
      if (!name) { $("err").textContent = "Enter your name so the agent knows who to call."; return; }
      if (phone.replace(/\D/g, "").length < 10) { $("err").textContent = "Enter a valid phone number, for example 0801 234 5678."; return; }
      $("err").textContent = "";

      const btn = $("inq").querySelector("button[type=submit]");
      btn.disabled = true; btn.textContent = "Sending...";
      try {
        await addDoc(collection(db, "inquiries"), {
          listingId: p.id,
          listingTitle: String(p.title).slice(0, 120),
          name: name.slice(0, 80),
          phone: phone.slice(0, 25),
          message: $("m").value.trim().slice(0, 1000),
          status: "new",
          createdAt: Date.now()
        });
        $("inq").hidden = true;
        $("sent").hidden = false;
        $("sent").textContent = `Thanks ${name.split(" ")[0]}, your inquiry was sent. The agent will contact you on ${phone}.`;
      } catch (err) {
        console.error(err);
        $("err").textContent = "We couldn't send your inquiry. Check your connection and try again, or use WhatsApp.";
        btn.disabled = false; btn.textContent = "Send inquiry";
      }
    });

    // ---- AI chat assistant ----
    document.body.insertAdjacentHTML("beforeend", `
      <button class="chat-fab" id="chatFab" type="button" aria-expanded="false" aria-controls="chat">Ask about this property</button>
      <section class="chat" id="chat" role="dialog" aria-label="Chat about this property" hidden>
        <div class="chat-head">
          <div><strong>Property assistant</strong><span>AI helper (demo)</span></div>
          <button class="chat-x" id="chatX" type="button" aria-label="Close chat">&times;</button>
        </div>
        <div class="chat-log" id="chatLog" aria-live="polite"></div>
        <div class="chips2" id="chatChips"></div>
        <form class="chat-form" id="chatForm">
          <input id="chatIn" maxlength="500" placeholder="Type your question..." aria-label="Your question" autocomplete="off">
          <button class="chat-send" id="chatSend" type="submit">Send</button>
        </form>
        <div class="chat-foot">AI can make mistakes. For anything important, use the inquiry form or WhatsApp.</div>
      </section>`);

    const chat = [];                       // the conversation sent to the bot
    const MAX_USER_MSGS = 15;              // keeps one visitor from running up usage
    let asked = 0, busy = false, greeted = false;

    const addBubble = (text, kind) => {
      const d = document.createElement("div");
      d.className = "bub " + kind; d.textContent = text;
      $("chatLog").appendChild(d); $("chatLog").scrollTop = $("chatLog").scrollHeight;
      return d;
    };

    function openChat(){
      $("chat").hidden = false; $("chatFab").hidden = true; $("chatFab").setAttribute("aria-expanded", "true");
      if (!greeted) {
        greeted = true;
        addBubble("Hi! Ask me anything about this property, like the price, features or how to book a viewing.", "bot");
        ["Is it still available?", "What's included?", "How do I book a viewing?"].forEach(q => {
          const c = document.createElement("button"); c.type = "button"; c.className = "chip2"; c.textContent = q;
          c.onclick = () => ask(q); $("chatChips").appendChild(c);
        });
      }
      $("chatIn").focus();
    }
    function closeChat(){
      $("chat").hidden = true; $("chatFab").hidden = false; $("chatFab").setAttribute("aria-expanded", "false");
      $("chatFab").focus();
    }
    $("chatFab").onclick = openChat;
    $("chatX").onclick = closeChat;
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("chat").hidden) closeChat(); });

    async function ask(text){
      text = text.trim();
      if (!text || busy) return;
      $("chatChips").textContent = "";
      if (asked >= MAX_USER_MSGS) {
        addBubble("You've reached the chat limit. Please use the inquiry form or the WhatsApp button and the agent will reply.", "note");
        return;
      }
      if (BOT_URL.includes("YOUR-SUBDOMAIN")) {
        addBubble("The assistant isn't connected yet. Set BOT_URL in this page to your Worker address.", "note");
        return;
      }
      asked++; busy = true; $("chatSend").disabled = true;
      addBubble(text, "me"); chat.push({ role: "user", content: text }); $("chatIn").value = "";
      const wait = addBubble("Typing...", "bot");

      try {
        const r = await fetch(BOT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            listing: { title: p.title, area: p.area, type: p.type, price: p.price, per: p.per,
                       beds: p.beds, baths: p.baths, sqm: p.sqm, desc: p.desc, features: p.features },
            messages: chat.slice(-8)
          })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.reply) throw new Error(j.error || "No reply");
        wait.textContent = j.reply; chat.push({ role: "assistant", content: j.reply });
      } catch (err) {
        console.error(err);
        wait.textContent = "Sorry, I couldn't answer just now. Please use the inquiry form or WhatsApp.";
        chat.pop();                        // don't keep the unanswered question in the history
      }
      busy = false; $("chatSend").disabled = false; $("chatLog").scrollTop = $("chatLog").scrollHeight; $("chatIn").focus();
    }
    $("chatForm").addEventListener("submit", e => { e.preventDefault(); ask($("chatIn").value); });
  }
</script>
</body>
</html>
